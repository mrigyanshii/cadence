name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_GROQ_KEY: ${{ secrets.GROQ_API != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: npx wrangler deploy
      - name: Skipping deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
      - name: Sync GROQ_API to the Worker
        if: env.HAS_CLOUDFLARE_TOKEN == 'true' && env.HAS_GROQ_KEY == 'true'
        run: printf '%s' "$GROQ_API" | npx wrangler secret put GROQ_API
        env:
          GROQ_API: ${{ secrets.GROQ_API }}
